<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
      <div  id="dragBox"
       draggable="true"
       style="width: 100px; height: 100px; background: #4da3ff; 
              border-radius: 10px; display: flex; align-items: center; 
              justify-content: center; color: white; font-weight: bold;
              cursor: grab; user-select: none; margin-bottom: 20px;">
    Drag me
      </div>

  <!-- Drop zone -->
  <div id="dropZone"
       style="width: 300px; height: 150px; border: 3px dashed #888; 
              border-radius: 10px; display: flex; align-items: center; 
              justify-content: center; color: #555; font-size: 18px;">
    Drop here
  </div>
  <script src="train.js"></script>
</body>
</html>
